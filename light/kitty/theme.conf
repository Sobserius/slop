# slop - light (Catppuccin Latte) kitty palette.
# Linked to ~/.config/kitty/theme.conf and included by shared/kitty/kitty.conf.

background #eff1f5
foreground #4c4f69
selection_background #ccd0da
selection_foreground #4c4f69

# Cursor
cursor #dc8a78
cursor_text_color #eff1f5

# URL highlight
url_color #1e66f5

# Search hits
match_background #df8e1d
match_foreground #eff1f5

# Tab bar
active_tab_background #ccd0da
active_tab_foreground #4c4f69
inactive_tab_background #eff1f5
inactive_tab_foreground #6c6f85

# Scrollback
scrollback_background #e6e9ef

# Window
window_border_color #ccd0da
window_active_border_color #1e66f5
window_inactive_border_color #ccd0da

# ============================================
# TERMINAL COLORS
# ============================================
# Black
color0 #acb0be
color8 #9ca0b0

# Red
color1 #d20f39
color9 #d20f39

# Green
color2 #40a02b
color10 #40a02b

# Yellow
color3 #df8e1d
color11 #df8e1d

# Blue
color4 #1e66f5
color12 #1e66f5

# Magenta
color5 #8839ef
color13 #8839ef

# Cyan
color6 #179299
color14 #179299

# White
color7 #acb0be
color15 #4c4f69