# slop - dark (Catppuccin Mocha) kitty palette.
# Linked to ~/.config/kitty/theme.conf and included by shared/kitty/kitty.conf.

background #1e1e2e
foreground #cdd6f4
selection_background #45475a
selection_foreground #cdd6f4

# Cursor
cursor #f5e0dc
cursor_text_color #1e1e2e

# URL highlight
url_color #89b4fa

# Search hits
match_background #f9e2af
match_foreground #1e1e2e

# Tab bar
active_tab_background #313244
active_tab_foreground #cdd6f4
inactive_tab_background #1e1e2e
inactive_tab_foreground #6c7086

# Scrollback
scrollback_background #181825

# Window
window_border_color #313244
window_active_border_color #89b4fa
window_inactive_border_color #313244

# ============================================
# TERMINAL COLORS
# ============================================
# Black
color0 #45475a
color8 #6c7086

# Red
color1 #f38ba8
color9 #f38ba8

# Green
color2 #a6e3a1
color10 #a6e3a1

# Yellow
color3 #f9e2af
color11 #f9e2af

# Blue
color4 #89b4fa
color12 #89b4fa

# Magenta
color5 #cba6f7
color13 #cba6f7

# Cyan
color6 #94e2d5
color14 #94e2d5

# White
color7 #cdd6f4
color15 #cdd6f4