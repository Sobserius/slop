# ============================================
# FONTS
# ============================================
font_family "JetBrains Mono Nerd Font"
symbol_map U+1F000- U+1F9FF "Noto Color Emoji"
font_size 12
line_height 1.2
letter_spacing 0

# ============================================
# WINDOW
# ============================================
window_padding_width 10
window_margin_width 0

# ============================================
# TABS
# ============================================
tab_bar_edge top
tab_bar_margin_height 6
tab_bar_margin_width 8

# ============================================
# SCROLLBAR
# ============================================
scrollbar_method plain

# ============================================
# MOUSE
# ============================================
mouse_hide_wait 2
copy_on_select yes

# ============================================
# PERFORMANCE
# ============================================
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ============================================
# KEYBINDS
# ============================================
# Close tab
map super+w close_tab

# New tab
map super+t new_tab

# New tab in cwd
map super+shift+t new_tab_with_cwd

# Next/prev tab
map super+right next_tab
map super+left previous_tab

# Tab numbers
map super+1 goto_tab 1
map super+2 goto_tab 2
map super+3 goto_tab 3
map super+4 goto_tab 4
map super+5 goto_tab 5
map super+6 goto_tab 6
map super+7 goto_tab 7
map super+8 goto_tab 8
map super+9 goto_tab 9

# ============================================
# STARTUP
# ============================================
startup_session none

# ============================================
# THEME
# ============================================
# ~/.config/kitty/theme.conf is a symlink into ~/slop/<theme>/kitty/theme.conf,
# so `switch-theme light` restyles every new window with no restart.
include theme.conf